<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoyaku Yo - 予約管理プラットフォーム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f0eb;
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 25px 80px -12px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 16px 12px;
    }
    .board {
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      background: #fafaf9;
      padding: 14px;
    }
    .board-title { font-size: 0.875rem; font-weight: 700; color: #292524; margin-bottom: 8px; }
    .board ul { margin: 0; padding-left: 1rem; font-size: 0.75rem; color: #57534e; line-height: 1.6; }
    .board .icon { font-size: 1.25rem; margin-bottom: 4px; }
    .qr-section {
      padding: 8px 24px 24px;
    }
    .qr-box {
      background: #f5f5f4;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .qr-box h3 { margin: 0 0 4px; font-size: 0.875rem; font-weight: 700; color: #292524; }
    .qr-box .hint { font-size: 0.7rem; color: #78716c; margin-bottom: 12px; }
    .qr-box img { display: block; margin: 0 auto; border-radius: 8px; background: #fff; padding: 8px; }
    .qr-box a { font-size: 0.75rem; color: #2563eb; margin-top: 8px; display: inline-block; }
    @page { size: A4; margin: 8mm; }
    @media print {
      body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
      .card {
        max-width: 100% !important;
        box-shadow: none !important;
        border: 1px solid #e5e7eb;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        page-break-inside: avoid !important;
      }
      .card * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .board { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; padding: 10px !important; }
      .boards { padding: 10px !important; gap: 8px !important; }
      .qr-box { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; padding: 12px !important; }
      .qr-section { padding: 6px 24px 16px !important; }
      .card { transform: scale(0.95); transform-origin: top center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="boards">
      <section class="board">
        <div class="icon">📅</div>
        <div class="board-title">いつでも予約</div>
        <ul>
          <li>24時間いつでも予約</li>
          <li>サロン・店舗を検索</li>
          <li>キャンセル・変更が簡単</li>
        </ul>
      </section>
      <section class="board">
        <div class="icon">📱</div>
        <div class="board-title">LINE・スマホ</div>
        <ul>
          <li>LINEで予約・リマインド</li>
          <li>スマホでサクサク</li>
          <li>アプリで管理</li>
        </ul>
      </section>
      <section class="board">
        <div class="icon">🏪</div>
        <div class="board-title">一括管理</div>
        <ul>
          <li>予約を一括管理</li>
          <li>カレンダーで確認</li>
          <li>紙・電話から卒業</li>
        </ul>
      </section>
      <section class="board">
        <div class="icon">💬</div>
        <div class="board-title">LINE連携</div>
        <ul>
          <li>LINEでお客様とつながる</li>
          <li>予約確認・リマインド自動</li>
          <li>空席を有効活用</li>
        </ul>
      </section>
    </div>
    <section class="qr-section">
      <div class="qr-box">
        <h3>アクセスはこちら</h3>
        <p class="hint">スマホでQRコードをスキャン → Download をタップ</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fwww.yoyakuyo.jp" alt="QR code" width="180" height="180">
        <a href="https://www.yoyakuyo.jp">Open → www.yoyakuyo.jp</a>
      </div>
    </section>
  </div>
</body>
</html>
