<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1e40af"/>
  <!-- Calendar: main card -->
  <rect x="96" y="128" width="320" height="256" rx="20" fill="white"/>
  <!-- Calendar: top tab (binding) -->
  <rect x="96" y="108" width="320" height="52" rx="26" fill="white"/>
  <!-- Two rings (spiral binding) -->
  <rect x="156" y="88" width="56" height="20" rx="10" fill="white"/>
  <rect x="300" y="88" width="56" height="20" rx="10" fill="white"/>
  <!-- Checkmark = booked / confirmed -->
  <path d="M160 280 L224 344 L352 216" stroke="#1e40af" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
